name: Backend release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: autostacgis-postgresql}
      - uses: actions/checkout@v4
        with: {repository: autostacgis/autostacgis-python, path: autostacgis-python}
      - uses: actions/checkout@v4
        with: {repository: autostacgis/autostacgis-plugins, path: autostacgis-plugins}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install build
      - run: python autostacgis-postgresql/scripts/build_engine_wheels.py
      - run: python -m build --wheel --outdir autostacgis-postgresql/wheels autostacgis-postgresql
      - name: Generate verified update manifest
        working-directory: autostacgis-postgresql
        run: python scripts/release_manifest.py "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@v2
        with:
          files: autostacgis-postgresql/wheels/*
          generate_release_notes: true
          prerelease: true
