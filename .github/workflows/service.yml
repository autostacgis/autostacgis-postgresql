name: service
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env: {POSTGRES_USER: autostacgis, POSTGRES_PASSWORD: test-password, POSTGRES_DB: autostacgis}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U autostacgis" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AUTOSTACGIS_DATABASE_URL: postgresql://autostacgis:test-password@127.0.0.1:5432/autostacgis
      AUTOSTACGIS_TEST_DSN: postgresql://autostacgis:test-password@127.0.0.1:5432/autostacgis
    steps:
      - uses: actions/checkout@v4
        with: {path: autostacgis-postgresql}
      - uses: actions/checkout@v4
        with: {repository: autostacgis/autostacgis-python, path: autostacgis-python}
      - uses: actions/checkout@v4
        with: {repository: autostacgis/autostacgis-plugins, path: autostacgis-plugins}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e autostacgis-python -e 'autostacgis-plugins[triggers]' -e 'autostacgis-postgresql[dev]'
      - run: autostacgis-server migrate
      - run: pytest autostacgis-postgresql/tests
      - run: ruff check autostacgis-postgresql/src autostacgis-postgresql/tests autostacgis-postgresql/scripts
      - run: ruff format --check autostacgis-postgresql/src autostacgis-postgresql/tests autostacgis-postgresql/scripts
      - run: python -m build autostacgis-postgresql
      - run: python autostacgis-postgresql/scripts/build_engine_wheels.py
      - name: Build and start the independent container service
        working-directory: autostacgis-postgresql
        run: |
          mkdir -p incoming
          docker compose up --build --detach --wait
          curl --fail http://127.0.0.1:8080/conformance
          curl --fail -H "Authorization: Bearer ci-api-token" http://127.0.0.1:8080/autostacgis/plugins > /dev/null
        env:
          POSTGRES_PASSWORD: ci-container-password
          AUTOSTACGIS_API_TOKEN: ci-api-token
      - name: Stop the test service
        if: always()
        working-directory: autostacgis-postgresql
        run: docker compose down --volumes
        env:
          POSTGRES_PASSWORD: ci-container-password
          AUTOSTACGIS_API_TOKEN: ci-api-token
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: autostacgis-web
    steps:
      - uses: actions/checkout@v4
        with: {path: autostacgis-postgresql}
      - uses: actions/checkout@v4
        with: {repository: autostacgis/autostacgis-python, path: autostacgis-python}
      - uses: actions/checkout@v4
        with: {repository: autostacgis/autostacgis-plugins, path: autostacgis-plugins}
      - uses: actions/checkout@v4
        with: {repository: autostacgis/autostacgis-web, path: autostacgis-web}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install build
      - name: Bundle service and engine wheels
        run: node scripts/bundle-backend.mjs
      - name: Verify native backend lifecycle and persistence
        run: node scripts/smoke-embedded.mjs
      - name: Verify plugins, workflows, and strict metadata
        run: node scripts/smoke-plugins.mjs
